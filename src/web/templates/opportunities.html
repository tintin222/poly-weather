<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>poly-weather // opportunities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { mono: ['JetBrains Mono', 'monospace'], display: ['Space Grotesk', 'sans-serif'] },
          colors: { term: { bg: '#0a0e14', surface: '#0f1419', border: '#1a2030', muted: '#3d4f6a', text: '#8b9fc0', bright: '#c5d4e8', green: '#00e396', red: '#ff4560', amber: '#feb019', cyan: '#00c8ff', purple: '#775dd0' } }
        }
      }
    }
  </script>
  <style>
    body { background: #0a0e14; font-family: 'JetBrains Mono', monospace; }
    .card { background: #0f1419; border: 1px solid #1a2030; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: #0a0e14; } ::-webkit-scrollbar-thumb { background: #1a2030; border-radius: 2px; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} } .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
    .btn { transition: all 0.15s; } .btn:hover { filter: brightness(1.2); } .btn:active { transform: scale(0.97); }
    input[type="number"] { background: #0a0e14; border: 1px solid #1a2030; color: #c5d4e8; padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 12px; }
  </style>
</head>
<body class="text-term-text text-xs min-h-screen">

  <header class="border-b border-term-border px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="/" class="flex items-center gap-2 hover:opacity-80">
        <div class="w-2 h-2 rounded-full bg-term-cyan pulse-dot"></div>
        <h1 class="font-display text-base font-bold text-term-bright tracking-tight">poly-weather</h1>
      </a>
      <nav class="flex gap-3 text-[11px]">
        <a href="/" class="text-term-muted hover:text-term-text">Dashboard</a>
        <a href="/opportunities" class="text-term-cyan">Opportunities</a>
        <a href="/config" class="text-term-muted hover:text-term-text">Config</a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="toggleSettled()" id="filter-settled-btn" class="btn px-3 py-1.5 rounded bg-term-surface text-term-muted border border-term-border text-[11px]">Show settled</button>
      <button onclick="refreshMarkets()" id="refresh-btn" class="btn px-3 py-1.5 rounded bg-term-cyan/10 text-term-cyan border border-term-cyan/20 text-[11px] font-medium">Refresh Markets</button>
      <button onclick="loadOpportunities()" class="btn px-3 py-1.5 rounded bg-term-surface text-term-text border border-term-border text-[11px]">Reload</button>
    </div>
  </header>

  <div id="status-bar" class="px-4 py-1.5 text-[10px] text-term-muted border-b border-term-border hidden">
    <span id="status-msg"></span>
  </div>

  <main class="p-4 max-w-[1400px] mx-auto">
    <div id="opportunities-container" class="space-y-4">
      <div class="text-center py-16 text-term-muted">Loading...</div>
    </div>
  </main>

  <script>
    let opportunities = [];
    let hideSettled = true;

    function isSettled(o) {
      return o.is_closed || (o.g && o.g.brackets && o.g.brackets.some(b => (b.yes_price || 0) >= 0.99));
    }

    function toggleSettled() {
      hideSettled = !hideSettled;
      document.getElementById('filter-settled-btn').textContent = hideSettled ? 'Show settled' : 'Hide settled';
      render();
    }

    async function loadOpportunities() {
      try {
        const res = await fetch('/api/opportunities');
        opportunities = await res.json();
        render();
      } catch (e) { showStatus('Error: ' + e.message); }
    }

    async function refreshMarkets() {
      showStatus('Refreshing markets...');
      await fetch('/api/refresh-markets', { method: 'POST' });
      await loadOpportunities();
      showStatus('Done', 2000);
    }

    async function triggerScrape(cityKey) {
      showStatus(`Scraping ${cityKey}...`);
      const res = await fetch(`/api/scrape/${encodeURIComponent(cityKey)}`, { method: 'POST' });
      const data = await res.json();
      if (data.job_id) pollJob(data.job_id, cityKey);
    }

    async function pollJob(jobId, cityKey) {
      const poll = async () => {
        const res = await fetch(`/api/job/${jobId}`);
        const data = await res.json();
        if (data.status === 'running') { setTimeout(poll, 2000); return; }
        if (data.status === 'complete') showStatus(`${cityKey}: ${data.observations} obs, peak ${data.peak_temp}°`, 3000);
        else showStatus(`Error: ${data.error}`, 5000);
        await loadOpportunities();
      };
      setTimeout(poll, 2000);
    }

    async function placeBet(params) {
      const amt = parseFloat(document.getElementById(`bet-amt-${params.city_key}`)?.value || 10);
      const size = Math.round(amt / params.price * 100) / 100;
      params.size = size;
      const cost = (params.price * size).toFixed(2);
      if (!confirm(`Paper bet: ${params.bracket_label} @ ${(params.price*100).toFixed(0)}¢ — $${cost}?`)) return;
      const qs = new URLSearchParams(params).toString();
      const res = await fetch('/api/place-bet?' + qs, { method: 'POST' });
      const data = await res.json();
      showStatus(data.success ? `Bet placed: ${data.order_id}` : `Failed: ${data.error_msg}`, 3000);
      await loadOpportunities();
    }

    function timeAgo(ts) {
      if (!ts) return 'never';
      const s = Math.round(Date.now() / 1000 - ts);
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.round(s/60)}m ago`;
      return `${Math.round(s/3600)}h ago`;
    }

    // ---- Render ----

    function render() {
      const container = document.getElementById('opportunities-container');
      const filtered = hideSettled ? opportunities.filter(o => !isSettled(o)) : opportunities;
      const today = filtered.filter(o => o.is_today);
      const future = filtered.filter(o => !o.is_today);
      const settledCount = opportunities.filter(isSettled).length;

      let html = `<div class="text-[11px] text-term-muted mb-3">${filtered.length} of ${opportunities.length} markets (${settledCount} settled)</div>`;

      if (today.length) {
        html += `<div class="text-term-cyan text-[11px] font-semibold uppercase tracking-wider mb-2">Today (${today.length})</div>`;
        html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">`;
        today.forEach(o => { html += renderCard(o); });
        html += `</div>`;
      }
      if (future.length) {
        html += `<div class="text-term-muted text-[11px] font-semibold uppercase tracking-wider mb-2 mt-6">Future (${future.length})</div>`;
        html += `<div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-3">`;
        future.forEach(o => { html += renderCardCompact(o); });
        html += `</div>`;
      }
      if (!today.length && !future.length) {
        html += `<div class="text-center py-12 text-term-muted text-lg">All markets settled. Click "Show settled" to view.</div>`;
      }
      container.innerHTML = html;
    }

    function renderCard(o) {
      const u = o.unit === 'fahrenheit' ? '°F' : '°C';
      const g = o.g;
      if (!g) return '';

      const actionColors = {
        'BUY': 'border-term-green/50 bg-term-green/5',
        'WATCH': 'border-term-amber/50 bg-term-amber/5',
        'WAIT': 'border-term-border bg-term-surface',
        'SKIP': 'border-term-red/30 bg-term-surface',
        'NO_DATA': 'border-term-border bg-term-surface',
      };
      const actionTextColors = {
        'BUY': 'text-term-green', 'WATCH': 'text-term-amber',
        'WAIT': 'text-term-muted', 'SKIP': 'text-term-red', 'NO_DATA': 'text-term-muted',
      };
      const borderClass = actionColors[g.action] || 'border-term-border';
      const textClass = actionTextColors[g.action] || 'text-term-muted';

      // WU Status
      let wuHTML = '';
      if (g.peak != null) {
        const trendIcon = g.trend < -0.5 ? '▼' : g.trend > 0.5 ? '▲' : '—';
        const trendColor = g.trend < -0.5 ? 'text-term-cyan' : g.trend > 0.5 ? 'text-term-red' : 'text-term-muted';
        wuHTML = `
          <div class="mb-3">
            <div class="text-[10px] text-term-muted uppercase tracking-wider mb-1">WU Weather <span class="text-term-text">(${timeAgo(g.wu_at)})</span></div>
            <div class="flex items-baseline gap-3">
              <span class="text-2xl font-display font-bold text-term-amber">${g.peak}${u}</span>
              <span class="text-term-muted">peak at ${g.peak_hour}:00</span>
              <span class="${trendColor}">${trendIcon} ${g.trend > 0 ? '+' : ''}${g.trend}${u}</span>
              <span class="text-term-muted">${g.obs_count} readings</span>
            </div>
            ${g.now_temp != null && g.now_temp != g.peak ? `<div class="text-[11px] text-term-muted mt-1">Now: ${g.now_temp}${u} at ${g.now_hour}:00 (${g.hours_since}h since peak)</div>` : ''}
          </div>`;
      } else {
        wuHTML = `<div class="text-term-muted mb-3 text-[11px]">No weather data scraped yet</div>`;
      }

      // Confidence bar
      let confHTML = '';
      if (g.conf > 0) {
        const pct = (g.conf * 100).toFixed(0);
        const barW = Math.min(g.conf * 100, 100);
        const confColor = g.conf >= 0.85 ? 'bg-term-green' : g.conf >= 0.5 ? 'bg-term-amber' : 'bg-term-red';
        const confText = g.conf >= 0.85 ? 'text-term-green' : g.conf >= 0.5 ? 'text-term-amber' : 'text-term-red';
        confHTML = `
          <div class="mb-3">
            <div class="text-[10px] text-term-muted uppercase tracking-wider mb-1">Peak Confidence</div>
            <div class="flex items-center gap-3">
              <span class="${confText} font-bold text-lg font-display">${pct}%</span>
              <div class="flex-1 h-2 bg-term-bg rounded-full overflow-hidden">
                <div class="${confColor}/60 h-full rounded-full" style="width:${barW}%"></div>
              </div>
            </div>
            ${g.conf_reason ? `<div class="text-[10px] text-term-muted mt-1">${g.conf_reason}</div>` : ''}
          </div>`;
      }

      // Market + matching bracket
      let marketHTML = '';
      if (g.match_bracket) {
        marketHTML = `
          <div class="mb-3">
            <div class="text-[10px] text-term-muted uppercase tracking-wider mb-1">Market <span class="text-term-text">(${timeAgo(g.mkt_at)})</span></div>
            <div class="text-[11px]">
              Matching bracket: <span class="text-term-cyan font-bold">${g.match_bracket}</span>
              at <span class="text-term-amber font-bold">${(g.match_price * 100).toFixed(0)}¢</span>
            </div>
          </div>`;
      }

      // Recommendation
      let recoHTML = `
        <div class="p-3 rounded border-2 ${borderClass} mb-3">
          <div class="flex items-center justify-between">
            <div>
              <span class="${textClass} font-bold text-lg font-display">${g.action}</span>
              ${g.action === 'BUY' && g.match_bracket ? `<span class="text-term-green text-[11px] ml-2">${g.match_bracket} @ ${(g.match_price*100).toFixed(0)}¢ — +${(g.edge*100).toFixed(0)}% edge</span>` : ''}
            </div>
            ${g.action === 'BUY' ? `
              <div class="flex items-center gap-2">
                <span class="text-term-muted text-[11px]">$</span>
                <input type="number" id="bet-amt-${o.city_key}" value="10" min="1" step="1" class="w-16 text-right">
                <button onclick='placeBet(${JSON.stringify({
                  event_id: o.event_id, bracket_id: g.match_id || 0, token_id: g.match_token || "",
                  price: g.match_price, city_key: o.city_key, date: o.date,
                  bracket_label: g.match_bracket, current_max_temp: g.peak || 0,
                  peak_hour: g.peak_hour || 0, model_confidence: g.conf,
                  expected_value: g.edge
                })})' class="btn px-3 py-1.5 rounded bg-term-green/20 text-term-green border border-term-green/30 text-[12px] font-bold">
                  Bet ${(g.match_price*100).toFixed(0)}¢
                </button>
              </div>` : ''}
          </div>
          <div class="text-[10px] ${textClass}/80 mt-1">${g.reason}</div>
        </div>`;

      // Brackets table (compact)
      let bracketsHTML = '';
      if (g.brackets && g.brackets.length) {
        const maxPrice = Math.max(...g.brackets.map(b => b.yes_price || 0), 0.01);
        bracketsHTML = '<div class="space-y-0.5">';
        g.brackets.forEach(b => {
          const pct = ((b.yes_price || 0) * 100).toFixed(0);
          const barW = Math.max(((b.yes_price || 0) / maxPrice) * 100, 1);
          const isMatch = g.match_bracket === b.label;
          const hl = isMatch ? 'bg-term-cyan/15 border-l-2 border-term-cyan pl-2' : '';
          bracketsHTML += `
            <div class="flex items-center gap-1 text-[10px] ${hl} py-0.5 rounded-sm">
              <span class="w-24 text-term-bright truncate">${b.label}</span>
              <div class="flex-1 h-2 bg-term-bg rounded-sm overflow-hidden">
                <div class="h-full rounded-sm ${isMatch ? 'bg-term-cyan/40' : 'bg-term-muted/20'}" style="width:${barW}%"></div>
              </div>
              <span class="w-8 text-right ${isMatch ? 'text-term-cyan font-bold' : 'text-term-muted'}">${pct}%</span>
            </div>`;
        });
        bracketsHTML += '</div>';
      }

      return `
        <div class="card rounded-md relative overflow-hidden">
          <div class="px-4 py-2 border-b border-term-border flex items-center justify-between">
            <div class="flex items-center gap-2">
              <h3 class="font-display font-semibold text-term-bright text-sm">${o.city_name}</h3>
              <span class="text-term-muted text-[10px]">${o.date}</span>
              ${o.hist_days > 0 ? `<span class="px-1 py-0.5 rounded text-[9px] bg-term-green/10 text-term-green">${o.hist_days}d</span>` : ''}
              ${o.is_closed ? '<span class="px-1 py-0.5 rounded text-[9px] bg-term-red/10 text-term-red">CLOSED</span>' : ''}
            </div>
            <div class="flex items-center gap-2">
              ${o.polymarket_url ? `<a href="${o.polymarket_url}" target="_blank" class="px-2 py-0.5 rounded text-[9px] bg-term-purple/10 text-term-purple border border-term-purple/20 hover:bg-term-purple/20">PM&nearr;</a>` : ''}
              ${o.current_hour != null ? `<span class="text-term-muted text-[10px]">${o.current_hour}:00</span>` : ''}
            </div>
          </div>
          <div class="p-4">
            ${wuHTML}
            ${confHTML}
            ${marketHTML}
            ${recoHTML}
            ${bracketsHTML}
            <div class="mt-3">
              <button onclick="triggerScrape('${o.city_key}')" class="btn px-3 py-1 rounded bg-term-cyan/10 text-term-cyan border border-term-cyan/20 text-[10px]">Re-scrape</button>
            </div>
          </div>
        </div>`;
    }

    function renderCardCompact(o) {
      const g = o.g;
      if (!g) return '';
      const top = g.brackets ? g.brackets.reduce((a, b) => (b.yes_price || 0) > (a.yes_price || 0) ? b : a, g.brackets[0] || {}) : {};
      return `
        <div class="card rounded-md relative p-3">
          <div class="flex items-center justify-between mb-1">
            <span class="font-display font-semibold text-term-bright text-[12px]">${o.city_name}</span>
            <div class="flex items-center gap-2">
              ${o.polymarket_url ? `<a href="${o.polymarket_url}" target="_blank" class="text-[9px] text-term-purple hover:text-term-bright">PM&nearr;</a>` : ''}
              <span class="text-term-muted text-[10px]">${o.date}</span>
            </div>
          </div>
          <div class="text-[10px] text-term-muted">
            ${top.label ? `Top: <span class="text-term-amber">${top.label}</span> @ ${((top.yes_price||0)*100).toFixed(0)}%` : ''}
          </div>
        </div>`;
    }

    function showStatus(msg, ms) {
      const bar = document.getElementById('status-bar');
      document.getElementById('status-msg').textContent = msg;
      bar.classList.remove('hidden');
      if (ms) setTimeout(() => bar.classList.add('hidden'), ms);
    }

    loadOpportunities();
    setInterval(loadOpportunities, 60000);
  </script>
</body>
</html>
