<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>poly-weather // opportunities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { mono: ['JetBrains Mono', 'monospace'], display: ['Space Grotesk', 'sans-serif'] },
          colors: { term: { bg: '#0a0e14', surface: '#0f1419', border: '#1a2030', muted: '#3d4f6a', text: '#8b9fc0', bright: '#c5d4e8', green: '#00e396', red: '#ff4560', amber: '#feb019', cyan: '#00c8ff', purple: '#775dd0' } }
        }
      }
    }
  </script>
  <style>
    body { background: #0a0e14; font-family: 'JetBrains Mono', monospace; }
    .card { background: #0f1419; border: 1px solid #1a2030; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: #0a0e14; } ::-webkit-scrollbar-thumb { background: #1a2030; border-radius: 2px; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} } .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
    .btn { transition: all 0.15s; } .btn:hover { filter: brightness(1.2); } .btn:active { transform: scale(0.97); }
    input[type="number"] { background: #0a0e14; border: 1px solid #1a2030; color: #c5d4e8; padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 12px; }
    .phase-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  </style>
</head>
<body class="text-term-text text-xs min-h-screen">

  <header class="border-b border-term-border px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="/" class="flex items-center gap-2 hover:opacity-80">
        <div class="w-2 h-2 rounded-full bg-term-cyan pulse-dot"></div>
        <h1 class="font-display text-base font-bold text-term-bright tracking-tight">poly-weather</h1>
      </a>
      <nav class="flex gap-3 text-[11px]">
        <a href="/" class="text-term-muted hover:text-term-text">Dashboard</a>
        <a href="/opportunities" class="text-term-cyan">Opportunities</a>
        <a href="/ai-betting" class="text-term-muted hover:text-term-text">AI Bot</a>
        <a href="/config" class="text-term-muted hover:text-term-text">Config</a>
        <a href="/jobs" class="text-term-muted hover:text-term-text">Jobs</a>
        <a href="/resolution-urls" class="text-term-muted hover:text-term-text">URLs</a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <div id="bot-indicator" class="flex items-center gap-1.5 px-2 py-1 rounded border border-term-border text-[10px] text-term-muted cursor-pointer" onclick="toggleBotPanel()" title="Click for bot details">
        <div id="bot-dot" class="w-1.5 h-1.5 rounded-full bg-term-muted"></div>
        <span id="bot-label">Bot: checking...</span>
      </div>
      <button onclick="toggleSettled()" id="filter-settled-btn" class="btn px-3 py-1.5 rounded bg-term-surface text-term-muted border border-term-border text-[11px]">Show settled</button>
      <button onclick="refreshMarkets()" id="refresh-btn" class="btn px-3 py-1.5 rounded bg-term-cyan/10 text-term-cyan border border-term-cyan/20 text-[11px] font-medium">Refresh Markets</button>
      <button onclick="loadOpportunities()" class="btn px-3 py-1.5 rounded bg-term-surface text-term-text border border-term-border text-[11px]">Reload</button>
    </div>
  </header>

  <!-- Bot status panel (hidden by default) -->
  <div id="bot-panel" class="hidden border-b border-term-border bg-term-surface/50">
    <div class="px-4 py-3 max-w-[1400px] mx-auto">
      <div class="flex items-start gap-6">
        <div>
          <div class="text-[10px] text-term-muted uppercase tracking-wider mb-1">Auto-Bet Bot</div>
          <div id="bot-detail-status" class="text-[11px] text-term-bright">--</div>
          <div id="bot-detail-action" class="text-[10px] text-term-muted mt-0.5">--</div>
        </div>
        <div>
          <div class="text-[10px] text-term-muted uppercase tracking-wider mb-1">Stats</div>
          <div id="bot-detail-stats" class="text-[10px] text-term-text">--</div>
        </div>
        <div class="flex-1">
          <div class="text-[10px] text-term-muted uppercase tracking-wider mb-1">Recent Activity</div>
          <div id="bot-detail-log" class="text-[10px] text-term-muted max-h-24 overflow-y-auto space-y-0.5">--</div>
        </div>
      </div>
    </div>
  </div>

  <div id="status-bar" class="px-4 py-1.5 text-[10px] text-term-muted border-b border-term-border hidden">
    <span id="status-msg"></span>
  </div>

  <main class="p-4 max-w-[1400px] mx-auto">
    <div id="opportunities-container" class="space-y-4">
      <div class="text-center py-16 text-term-muted">Loading...</div>
    </div>
  </main>

  <script>
    let opportunities = [];
    let hideSettled = true;
    let botPanelOpen = false;

    // Bot status polling
    async function loadBotStatus() {
      try {
        const res = await fetch('/api/bot-status');
        const s = await res.json();
        const dot = document.getElementById('bot-dot');
        const label = document.getElementById('bot-label');

        if (s.running) {
          dot.className = 'w-1.5 h-1.5 rounded-full bg-term-green pulse-dot';
          label.textContent = `Bot: ON (${s.bets_placed} bets)`;
          label.className = 'text-term-green';
          document.getElementById('bot-indicator').className =
            'flex items-center gap-1.5 px-2 py-1 rounded border border-term-green/30 bg-term-green/5 text-[10px] cursor-pointer';
        } else {
          dot.className = 'w-1.5 h-1.5 rounded-full bg-term-red';
          label.textContent = 'Bot: OFF';
          label.className = 'text-term-red';
          document.getElementById('bot-indicator').className =
            'flex items-center gap-1.5 px-2 py-1 rounded border border-term-red/30 bg-term-red/5 text-[10px] cursor-pointer';
        }

        // Update panel details
        const upH = Math.floor(s.uptime_seconds / 3600);
        const upM = Math.floor((s.uptime_seconds % 3600) / 60);
        document.getElementById('bot-detail-status').textContent =
          s.running ? `Running for ${upH}h ${upM}m` : 'Not running';
        document.getElementById('bot-detail-action').textContent = s.last_action || 'Idle';
        document.getElementById('bot-detail-stats').innerHTML =
          `Cycles: ${s.cycle_count} | Bets: ${s.bets_placed} | Cities eval'd: ${s.cities_evaluated} | Errors: ${s.errors_recent}` +
          (s.last_bet_at ? `<br>Last bet: ${timeAgo(s.last_bet_at)}` : '');

        // Recent log
        const logEl = document.getElementById('bot-detail-log');
        if (s.recent_log && s.recent_log.length) {
          logEl.innerHTML = s.recent_log.slice().reverse().map(e => {
            const typeColor = e.type === 'AUTO_BET' ? 'text-term-green' :
                              e.type === 'error' ? 'text-term-red' :
                              e.type === 'scrape' ? 'text-term-cyan' : 'text-term-muted';
            return `<div><span class="${typeColor}">[${e.type}]</span> ${e.detail} <span class="text-term-muted">${timeAgo(e.ts)}</span></div>`;
          }).join('');
        } else {
          logEl.textContent = 'No activity yet';
        }
      } catch (e) {
        document.getElementById('bot-label').textContent = 'Bot: error';
      }
    }

    function toggleBotPanel() {
      botPanelOpen = !botPanelOpen;
      document.getElementById('bot-panel').classList.toggle('hidden', !botPanelOpen);
      if (botPanelOpen) loadBotStatus();
    }

    function isSettled(o) {
      return o.is_closed || (o.g && o.g.brackets && o.g.brackets.some(b => (b.yes_price || 0) >= 0.99));
    }

    function toggleSettled() {
      hideSettled = !hideSettled;
      document.getElementById('filter-settled-btn').textContent = hideSettled ? 'Show settled' : 'Hide settled';
      render();
    }

    async function loadOpportunities() {
      try {
        const res = await fetch('/api/opportunities');
        opportunities = await res.json();
        render();
      } catch (e) { showStatus('Error: ' + e.message); }
    }

    async function refreshMarkets() {
      showStatus('Refreshing markets...');
      await fetch('/api/refresh-markets', { method: 'POST' });
      await loadOpportunities();
      showStatus('Done', 2000);
    }

    async function triggerScrape(cityKey) {
      showStatus(`Scraping ${cityKey}...`);
      const res = await fetch(`/api/scrape/${encodeURIComponent(cityKey)}`, { method: 'POST' });
      const data = await res.json();
      if (data.job_id) pollJob(data.job_id, cityKey);
    }

    async function pollJob(jobId, cityKey) {
      const poll = async () => {
        const res = await fetch(`/api/job/${jobId}`);
        const data = await res.json();
        if (data.status === 'running') { setTimeout(poll, 2000); return; }
        if (data.status === 'complete') showStatus(`${cityKey}: ${data.observations} obs, peak ${data.peak_temp}°`, 3000);
        else showStatus(`Error: ${data.error}`, 5000);
        await loadOpportunities();
      };
      setTimeout(poll, 2000);
    }

    async function placeBet(params) {
      const amt = parseFloat(document.getElementById(`bet-amt-${params.city_key}`)?.value || 10);
      const size = Math.round(amt / params.price * 100) / 100;
      params.size = size;
      const cost = (params.price * size).toFixed(2);
      if (!confirm(`Paper bet: ${params.bracket_label} @ ${(params.price*100).toFixed(0)}¢ — $${cost}?`)) return;
      const qs = new URLSearchParams(params).toString();
      const res = await fetch('/api/place-bet?' + qs, { method: 'POST' });
      const data = await res.json();
      showStatus(data.success ? `Bet placed: ${data.order_id}` : `Failed: ${data.error_msg}`, 3000);
      await loadOpportunities();
    }

    function timeAgo(ts) {
      if (!ts) return 'never';
      const s = Math.round(Date.now() / 1000 - ts);
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.round(s/60)}m ago`;
      return `${Math.round(s/3600)}h ago`;
    }

    function wuFreshness(ts) {
      const age = Date.now() / 1000 - ts;
      if (age < 300) return { cls: 'text-term-muted', label: timeAgo(ts) };
      if (age < 900) return { cls: 'text-term-amber', label: timeAgo(ts) };
      return { cls: 'text-term-red', label: '⚠ ' + timeAgo(ts) };
    }

    // Phase display config
    const PHASE_CONFIG = {
      'AT_PEAK':     { label: 'At Peak',     color: 'bg-term-green/15 text-term-green border-term-green/30', icon: '●', sortOrder: 0 },
      'NEAR_PEAK':   { label: 'Near Peak',   color: 'bg-term-amber/15 text-term-amber border-term-amber/30', icon: '◐', sortOrder: 1 },
      'APPROACHING': { label: 'Approaching', color: 'bg-term-cyan/15 text-term-cyan border-term-cyan/30',   icon: '→', sortOrder: 2 },
      'COOLING':     { label: 'Cooling',     color: 'bg-term-purple/15 text-term-purple border-term-purple/30', icon: '↓', sortOrder: 3 },
      'UNKNOWN':     { label: 'No Data',     color: 'bg-term-surface text-term-muted border-term-border',   icon: '?', sortOrder: 4 },
      'FUTURE':      { label: 'Future',      color: 'bg-term-surface text-term-muted border-term-border',   icon: '○', sortOrder: 5 },
    };

    function peakTimingLabel(o) {
      if (!o.is_today) return '';
      if (o.mean_peak_hour == null) return 'avg peak unknown';
      const h = o.hours_to_peak;
      const mph = o.mean_peak_hour;
      const mphStr = `${Math.floor(mph)}:${String(Math.round((mph % 1) * 60)).padStart(2, '0')}`;
      if (Math.abs(h) <= 1) return `at peak window (avg ${mphStr})`;
      if (h < 0) return `${Math.abs(h).toFixed(1)}h until avg peak (${mphStr})`;
      return `${h.toFixed(1)}h past avg peak (${mphStr})`;
    }

    // ---- Render ----

    function render() {
      const container = document.getElementById('opportunities-container');
      const filtered = hideSettled ? opportunities.filter(o => !isSettled(o)) : opportunities;
      const today = filtered.filter(o => o.is_today);
      const future = filtered.filter(o => !o.is_today);
      const settledCount = opportunities.filter(isSettled).length;

      let html = `<div class="text-[11px] text-term-muted mb-3">${filtered.length} of ${opportunities.length} markets (${settledCount} settled) — sorted by proximity to peak time</div>`;

      if (today.length) {
        // Group today's opportunities by phase
        const phaseOrder = ['AT_PEAK', 'NEAR_PEAK', 'APPROACHING', 'COOLING', 'UNKNOWN'];
        const grouped = {};
        phaseOrder.forEach(p => { grouped[p] = []; });
        today.forEach(o => {
          const phase = o.peak_phase || 'UNKNOWN';
          if (!grouped[phase]) grouped[phase] = [];
          grouped[phase].push(o);
        });

        html += `<div class="text-term-cyan text-[11px] font-semibold uppercase tracking-wider mb-2">Today (${today.length})</div>`;

        // Peak timing overview bar
        html += renderPeakTimeline(today);

        phaseOrder.forEach(phase => {
          const items = grouped[phase];
          if (!items || !items.length) return;
          const cfg = PHASE_CONFIG[phase];
          html += `<div class="mb-4">`;
          html += `<div class="flex items-center gap-2 mb-2 mt-4">`;
          html += `<span class="phase-badge border ${cfg.color}">${cfg.icon} ${cfg.label}</span>`;
          html += `<span class="text-term-muted text-[10px]">${items.length} ${items.length === 1 ? 'city' : 'cities'}</span>`;
          html += `</div>`;
          html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">`;
          items.forEach(o => { html += renderCard(o); });
          html += `</div></div>`;
        });
      }

      if (future.length) {
        html += `<div class="text-term-muted text-[11px] font-semibold uppercase tracking-wider mb-2 mt-6">Future (${future.length})</div>`;
        html += `<div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-3">`;
        future.forEach(o => { html += renderCardCompact(o); });
        html += `</div>`;
      }
      if (!today.length && !future.length) {
        html += `<div class="text-center py-12 text-term-muted text-lg">All markets settled. Click "Show settled" to view.</div>`;
      }
      container.innerHTML = html;
    }

    function renderPeakTimeline(todayOpps) {
      // Visual timeline showing each city's position relative to their peak
      const withPeak = todayOpps.filter(o => o.mean_peak_hour != null);
      if (!withPeak.length) return '';

      let html = `<div class="card rounded-md p-3 mb-4">`;
      html += `<div class="text-[10px] text-term-muted uppercase tracking-wider mb-2">Peak Proximity Timeline</div>`;
      html += `<div class="space-y-1.5">`;

      withPeak.forEach(o => {
        const h = o.hours_to_peak;
        const proximity = o.peak_proximity;
        // Map hours_to_peak to a position: -12h to +12h mapped to 0% to 100%
        const pct = Math.max(2, Math.min(98, ((h + 12) / 24) * 100));
        const cfg = PHASE_CONFIG[o.peak_phase] || PHASE_CONFIG['UNKNOWN'];
        const dotColor = o.peak_phase === 'AT_PEAK' ? 'bg-term-green' :
                         o.peak_phase === 'NEAR_PEAK' ? 'bg-term-amber' :
                         o.peak_phase === 'APPROACHING' ? 'bg-term-cyan' :
                         o.peak_phase === 'COOLING' ? 'bg-term-purple' : 'bg-term-muted';

        html += `<div class="flex items-center gap-2">`;
        html += `<span class="w-20 text-[10px] text-term-bright truncate text-right">${o.city_name}</span>`;
        html += `<div class="flex-1 relative h-4">`;
        // Background track
        html += `<div class="absolute inset-y-0 inset-x-0 flex items-center"><div class="w-full h-px bg-term-border"></div></div>`;
        // Center mark (peak time)
        html += `<div class="absolute top-0 bottom-0 left-1/2 w-px bg-term-muted/30"></div>`;
        // City dot at current position
        html += `<div class="absolute top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full ${dotColor} shadow-sm" style="left: ${pct}%"></div>`;
        html += `</div>`;
        html += `<span class="w-28 text-[10px] ${h <= 0 ? 'text-term-cyan' : 'text-term-purple'}">${h <= 0 ? Math.abs(h).toFixed(1) + 'h to peak' : h.toFixed(1) + 'h past'}</span>`;
        html += `</div>`;
      });

      html += `<div class="flex items-center gap-2 mt-1">`;
      html += `<span class="w-20"></span>`;
      html += `<div class="flex-1 flex justify-between text-[9px] text-term-muted">`;
      html += `<span>-12h</span><span>-6h</span><span class="text-term-text">Peak</span><span>+6h</span><span>+12h</span>`;
      html += `</div>`;
      html += `<span class="w-28"></span>`;
      html += `</div>`;

      html += `</div></div>`;
      return html;
    }

    function renderCard(o) {
      const u = o.unit === 'fahrenheit' ? '°F' : '°C';
      const g = o.g;
      if (!g) return '';

      const actionTextColors = {
        'BUY': 'text-term-green', 'WATCH': 'text-term-amber',
        'WAIT': 'text-term-muted', 'SKIP': 'text-term-red', 'NO_DATA': 'text-term-muted',
      };
      const textClass = actionTextColors[g.action] || 'text-term-muted';

      const phaseCfg = PHASE_CONFIG[o.peak_phase] || PHASE_CONFIG['UNKNOWN'];
      const timingLabel = peakTimingLabel(o);

      // Row 3: WU data strip
      let wuStrip = '';
      if (g.peak != null) {
        const trendIcon = g.trend < -0.5 ? '▼' : g.trend > 0.5 ? '▲' : '—';
        const trendColor = g.trend < -0.5 ? 'text-term-cyan' : g.trend > 0.5 ? 'text-term-amber' : 'text-term-muted';
        const fresh = g.wu_at ? wuFreshness(g.wu_at) : { cls: 'text-term-muted', label: 'unknown' };
        wuStrip = `<span class="text-term-bright">WU: ${g.peak}${u}</span> at ${g.peak_hour}:00 · <span class="${fresh.cls}">${fresh.label}</span> · <span class="${trendColor}">${trendIcon}${g.trend > 0 ? '+' : ''}${g.trend}${u}</span> · ${g.obs_count} rdgs`;
      } else {
        wuStrip = `<span class="text-term-muted">No weather data scraped yet</span>`;
      }

      // Best bracket line
      const bestLine = g.best_bracket
        ? `Best: <b class="text-term-green">${g.best_bracket}</b> @ ${(g.best_bracket_price * 100).toFixed(0)}¢`
        : '';
      const matchLine = (g.match_bracket && g.match_bracket !== g.best_bracket)
        ? ` · Matched: <span class="text-term-muted">${g.match_bracket}</span> @ <span class="${g.match_price < 0.02 ? 'text-term-red' : 'text-term-amber'}">${(g.match_price * 100).toFixed(0)}¢${g.match_price < 0.02 ? ' In Review' : ''}</span>`
        : '';
      const confLine = g.conf > 0 ? ` · Conf: ${(g.conf * 100).toFixed(0)}%` : '';

      // Buy button (inline)
      const buyBtn = g.action === 'BUY' ? `
        <div class="flex items-center gap-1 shrink-0">
          <span class="text-term-muted text-[10px]">$</span>
          <input type="number" id="bet-amt-${o.city_key}" value="10" min="1" step="1" style="background:#0a0e14;border:1px solid #1a2030;color:#c5d4e8;padding:2px 4px;border-radius:4px;font-family:inherit;font-size:10px;width:52px;text-align:right">
          <button onclick='placeBet(${JSON.stringify({
            event_id: o.event_id, bracket_id: g.match_id || 0, token_id: g.match_token || "",
            price: g.match_price, city_key: o.city_key, date: o.date,
            bracket_label: g.match_bracket, current_max_temp: g.peak || 0,
            peak_hour: g.peak_hour || 0, model_confidence: g.conf,
            expected_value: g.edge
          })})' class="btn px-2 py-0.5 rounded bg-term-green/20 text-term-green border border-term-green/30 text-[10px] font-bold">
            Bet ${(g.match_price * 100).toFixed(0)}¢
          </button>
        </div>` : '';

      // Compact bracket bars
      let bracketsHTML = '';
      if (g.brackets && g.brackets.length) {
        const maxPrice = Math.max(...g.brackets.map(b => b.yes_price || 0), 0.01);
        bracketsHTML = '<div class="space-y-0.5 mt-2">';
        g.brackets.forEach(b => {
          const pct = ((b.yes_price || 0) * 100).toFixed(0);
          const barW = Math.max(((b.yes_price || 0) / maxPrice) * 100, 1);
          const isBest = g.best_bracket === b.label;
          const isMatch = !isBest && g.match_bracket === b.label;
          const hl = isBest ? 'bg-term-green/10 border-l-2 border-term-green pl-1'
                   : isMatch ? 'bg-term-cyan/10 border-l-2 border-term-cyan pl-1' : '';
          bracketsHTML += `
            <div class="flex items-center gap-1 text-[9px] ${hl} py-0.5 rounded-sm">
              <span class="w-20 text-term-bright truncate">${b.label}</span>
              <div class="flex-1 h-1.5 bg-term-bg rounded-sm overflow-hidden">
                <div class="h-full rounded-sm ${isBest ? 'bg-term-green/50' : isMatch ? 'bg-term-cyan/40' : 'bg-term-muted/20'}" style="width:${barW}%"></div>
              </div>
              <span class="w-7 text-right ${isBest ? 'text-term-green font-bold' : isMatch ? 'text-term-cyan font-bold' : 'text-term-muted'}">${pct}%</span>
            </div>`;
        });
        bracketsHTML += '</div>';
      }

      return `
        <div class="card rounded-md relative overflow-hidden">
          <!-- Row 1: Header -->
          <div class="px-3 py-1.5 border-b border-term-border flex items-center justify-between">
            <div class="flex items-center gap-2">
              <h3 class="font-display font-semibold text-term-bright text-sm"><a href="/city/${encodeURIComponent(o.city_key)}" class="hover:text-term-cyan">${o.city_name}</a></h3>
              <span class="text-term-muted text-[10px]">${o.date}</span>
              ${o.hist_days > 0 ? `<span class="px-1 py-0.5 rounded text-[9px] bg-term-green/10 text-term-green">${o.hist_days}d</span>` : ''}
              ${o.is_closed ? '<span class="px-1 py-0.5 rounded text-[9px] bg-term-red/10 text-term-red">CLOSED</span>' : ''}
            </div>
            <div class="flex items-center gap-2">
              <span class="phase-badge border ${phaseCfg.color}">${phaseCfg.icon} ${phaseCfg.label}</span>
              ${o.polymarket_url ? `<a href="${o.polymarket_url}" target="_blank" class="px-2 py-0.5 rounded text-[9px] bg-term-purple/10 text-term-purple border border-term-purple/20 hover:bg-term-purple/20">PM&nearr;</a>` : ''}
              ${o.current_time ? `<span class="text-term-muted text-[10px]">Now ${o.current_time}</span>` : ''}
            </div>
          </div>
          <!-- Row 2: Timing (only when relevant) -->
          ${timingLabel ? `<div class="px-3 py-1 border-b border-term-border/50 text-[10px] ${phaseCfg.color.split(' ')[1]}">${phaseCfg.icon} ${timingLabel}</div>` : ''}
          <!-- Row 3: Data strip -->
          <div class="px-3 py-1.5 border-b border-term-border/50 text-[10px] space-y-0.5">
            <div class="text-term-muted">${wuStrip}</div>
            <div class="text-term-muted">${bestLine}${matchLine}${confLine}</div>
          </div>
          <!-- Row 4: Action + brackets + re-scrape -->
          <div class="px-3 py-2">
            <div class="flex items-center gap-2">
              <span class="${textClass} font-bold text-[11px] font-display shrink-0">${g.action}</span>
              ${buyBtn}
              <span class="text-[10px] text-term-muted truncate flex-1" title="${g.reason.replace(/"/g, '&quot;')}">${g.reason}</span>
              <button onclick="triggerScrape('${o.city_key}')" class="btn px-2 py-0.5 rounded text-[9px] text-term-muted border border-term-border hover:text-term-cyan hover:border-term-cyan/30 shrink-0">Re-scrape</button>
            </div>
            ${bracketsHTML}
          </div>
        </div>`;
    }

    function renderCardCompact(o) {
      const g = o.g;
      if (!g) return '';
      const top = g.brackets ? g.brackets.reduce((a, b) => (b.yes_price || 0) > (a.yes_price || 0) ? b : a, g.brackets[0] || {}) : {};
      const phaseCfg = PHASE_CONFIG[o.peak_phase] || PHASE_CONFIG['FUTURE'];
      return `
        <div class="card rounded-md relative p-3">
          <div class="flex items-center justify-between mb-1">
            <a href="/city/${encodeURIComponent(o.city_key)}" class="font-display font-semibold text-term-bright text-[12px] hover:text-term-cyan">${o.city_name}</a>
            <div class="flex items-center gap-2">
              ${o.mean_peak_hour != null ? `<span class="text-[9px] text-term-muted">avg peak ${Math.floor(o.mean_peak_hour)}:00</span>` : ''}
              ${o.polymarket_url ? `<a href="${o.polymarket_url}" target="_blank" class="text-[9px] text-term-purple hover:text-term-bright">PM&nearr;</a>` : ''}
              <span class="text-term-muted text-[10px]">${o.date}</span>
            </div>
          </div>
          <div class="text-[10px] text-term-muted">
            ${top.label ? `Top: <span class="text-term-amber">${top.label}</span> @ ${((top.yes_price||0)*100).toFixed(0)}%` : ''}
          </div>
        </div>`;
    }

    function showStatus(msg, ms) {
      const bar = document.getElementById('status-bar');
      document.getElementById('status-msg').textContent = msg;
      bar.classList.remove('hidden');
      if (ms) setTimeout(() => bar.classList.add('hidden'), ms);
    }

    loadOpportunities();
    loadBotStatus();
    setInterval(loadOpportunities, 60000);
    setInterval(loadBotStatus, 15000);
  </script>
</body>
</html>
